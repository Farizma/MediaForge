# Publish a release on GitHub (Releases > Draft a new release, tag v1.0.0) or push a tag like v1.0.0 ->
# tests run, the setup wizard is built on Windows, and MediaForge_setup_v1.0.0.exe, its .sha256 (the in-app
# updater refuses an installer without it) and a zip are attached to the release.
# "Run workflow" by hand (and the Monday rebuild) makes the same files as a downloadable artifact, publishing nothing.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"       # Mondays: a fresh build artifact, so the bundled yt-dlp / ffmpeg stay current

permissions:
  contents: write

concurrency:                  # a release made on the website can also fire the tag push: build one at a time
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path mediaforge/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match __version__ $v in mediaforge/__init__.py" }

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the program and the setup wizard
        run: python tools/build_exe.py --installer --no-open

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-windows
          path: |
            dist/MediaForge_setup_v*.exe
            dist/MediaForge_setup_v*.exe.sha256
            dist/MediaForge-*-win64.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $v = $tag.TrimStart("v")
          $files = "dist/MediaForge_setup_v$v.exe", "dist/MediaForge_setup_v$v.exe.sha256", "dist/MediaForge-$v-win64.zip"
          foreach ($f in $files) { if (-not (Test-Path $f)) { throw "Missing $f" } }
          $notes = "release-notes/$tag.md"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # made on the website: attach the files, and fill in the notes only if none were written there
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE) { throw "Uploading to release $tag failed" }
            $body = gh release view $tag --json body --jq .body
            if ([string]::IsNullOrWhiteSpace($body) -and (Test-Path $notes)) { gh release edit $tag --notes-file $notes }
          } elseif (Test-Path $notes) {
            gh release create $tag @files --title "MediaForge $tag" --notes-file $notes
          } else {
            gh release create $tag @files --title "MediaForge $tag" --generate-notes
          }
          if ($LASTEXITCODE) { throw "Publishing release $tag failed" }
